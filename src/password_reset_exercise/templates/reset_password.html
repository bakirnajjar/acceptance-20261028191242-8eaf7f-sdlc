{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <section class="panel" aria-labelledby="page-heading">
    <h1 id="page-heading">Reset password</h1>
    <p>Enter a new password for your account.</p>
    {% if form_error %}<p role="alert">{{ form_error }}</p>{% endif %}
    <form action="" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" type="password"
               autocomplete="new-password" required
               {% if password_error %}aria-invalid="true" aria-describedby="password-error"{% endif %}>
        {% if password_error %}<p id="password-error" role="alert">{{ password_error }}</p>{% endif %}
      </div>
      <button type="submit">Reset password</button>
    </form>
    <a class="back-link" href="{{ url_for('forgot_password') }}">Request another link</a>
  </section>
{% endblock %}
