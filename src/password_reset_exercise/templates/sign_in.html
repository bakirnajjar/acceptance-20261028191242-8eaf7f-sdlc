{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
  <section class="panel sign-in-panel" aria-labelledby="page-heading">
    <h1 id="page-heading">Sign in</h1>
    <form action="{{ url_for('sign_in') }}" method="post">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username"
               placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="********" required>
      </div>
      <a class="recovery-link" href="{{ url_for('forgot_password') }}">Forgot password?</a>
      <button type="submit">Sign in</button>
    </form>
    <p class="footer-note">No account? Contact your administrator.</p>
  </section>
{% endblock %}
